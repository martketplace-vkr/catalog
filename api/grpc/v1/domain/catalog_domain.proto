syntax = "proto3";

package martketplace.vkr.catalog.v1.domain;

option go_package = "github.com/martketplace-vkr/catalog/pkg/api/grpc/v1/domain;domain";

import "google/protobuf/timestamp.proto";

message Category {
  int64 id = 1;
  string name = 2;
  int64 parent_id = 3;
  repeated Category children = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Product {
  int64 id = 1;
  int64 vendor_id = 2;
  int64 category_id = 3;
  string name = 4;
  string description = 5;
  string price = 6;
  uint32 stock_count = 7;
  repeated ProductAttribute attributes = 8;
  repeated ProductImage images = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  repeated ProductCharacteristic characteristics = 12;
  bool accepts_crypto = 13;
  string crypto_pricing_mode = 14;
  string crypto_price_usdt = 15;
  string effective_usdt_price = 16;
  string rub_per_usdt = 17;
}

message ProductAttribute {
  int64 id = 1;
  string name = 2;
  string value = 3;
}

message ProductAttributeInput {
  string name = 1;
  string value = 2;
}

message ProductCharacteristic {
  int64 id = 1;
  string title = 2;
  repeated ProductAttribute attributes = 3;
}

message ProductCharacteristicInput {
  string title = 1;
  repeated ProductAttributeInput attributes = 2;
}

message ProductImage {
  int64 id = 1;
  string url = 2;
  bool is_main = 3;
}

message ProductImageInput {
  string url = 1;
  bool is_main = 2;
}
